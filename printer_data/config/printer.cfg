[fan_generic Nevermore]
pin: gpio18
max_power: 1.0
shutdown_speed: 1
kick_start_time: 0.5                                                # Depending on your fan, you may need to increase this value if your fan will not start
off_below: 0.13
cycle_time: 0.010
#heater: heater_bed, extruder
#heater_temp: 40.0
#fan_speed: 1.0

[controller_fan pi_fan]
pin: gpio20
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
#hardware_pwm:
kick_start_time: 0.5
off_below: 0.13
#heater: heater_bed, extruder
#heater_temp: 50.0
fan_speed: 1.0
stepper: stepper_y
#   default stepper is all of them.


